    <span><span class="drop">! 未反論</span> 相手が答えていない</span>
    <span><span class="late">レイト</span> 答える機会のあった反駁で答えず、後の反駁で出した遅い反論（反論された自分の論点を後から立て直す延長も含む。薄い取り消し線付き）。審査員が認めなかった場合は、カードをクリックして印の「× 取り消す」を押す</span></div>
    <p class="note">カードの番号「肯1-2·否a」は「肯1-2 への否定側の a 番目」。前半の「肯1-2」を押すと反論先へ移ります。</p></section>
  <section><h3>基本の流れ</h3><p style="margin:0">列がスピーチ（左から時系列）、横の帯が1つの論点です。反論は反論先と同じ高さに置かれ、矢印でつながります。カード上部の「→ 肯1-2 …」が反論先、色と記号（肯＝四角、否＝丸）が側を示します。<br>スピーチが始まったら列見出し（または <kbd>]</kbd>）で「現在のスピーチ」を切り替えます。新しいカードは現在のスピーチの列にだけ入るので、反駁中に誤って立論の列へ書き込むことはありません。<br>過去のスピーチのカードはクリックすると修正でき、<kbd>Esc</kbd> で現在のスピーチの記入に戻ります。</p></section>
  <section><h3>書く（カードを選んでいるとき）</h3><div class="kcols"><dl class="keys">
    ${K('<kbd>；</kbd> / <kbd>＋</kbd>（何も選んでいなければ <kbd>Shift</kbd>+<kbd>矢印</kbd> でも可）','立論・質疑：現在のスピーチに新しい論点。反駁：一番上の論点への反駁をすぐ書き始める（現在のスピーチでまだ書いていない一番上の行の、相手側の最も新しいスピーチの論点）。反駁先は <kbd>Shift</kbd>+<kbd>矢印</kbd> で変えられ、空のまま通り過ぎた反駁は消える')}${K('<kbd>Shift</kbd>+<kbd>G</kbd>','立論で現状分析を追加（全論点より上に置かれる。番号は「肯現」「否現」、未反論の表示や反駁先の自動選択からは外れる）。カードを書いている途中は通常の「G」入力になるので、Esc で確定してから押す')}${K('<kbd>R</kbd>','選んだカードに反論（現在のスピーチの列に入る。現在のスピーチより前の論点のみ）')}${K('<kbd>S</kbd>','選んだカードの下位論点')}${K('クリック / <kbd>Enter</kbd> / <kbd>F2</kbd>','書き直す。過去のスピーチのカードは「修正中」になり、<kbd>Esc</kbd> で現在のスピーチの記入に戻る（新しいカードは現在のスピーチにだけ追加される）')}
  </dl><dl class="keys">
    ${K('<kbd>L</kbd>','クロスアプライ（別の論点にも適用）')}${K('<kbd>P</kbd>','反論先を付け替える')}${K('<kbd>*</kbd> / <kbd>Q</kbd>','重要マーク')}${K('<kbd>X</kbd>','放棄・譲歩として薄く表示')}${K('<kbd>Shift</kbd>+<kbd>Delete</kbd>（Mac は <kbd>Shift</kbd>+<kbd>fn</kbd>+<kbd>delete</kbd>）','削除（下位・反論ごと。Ctrl+Z で戻せる）')}
  </dl></div></section>
  <section><h3>入力中</h3><dl class="keys">${K('<kbd>Enter</kbd>','改行')}${K('<kbd>Esc</kbd> / 枠の外をクリック','確定（空のカードは消える）')}${K('<kbd>Ctrl</kbd>+<kbd>Enter</kbd>（Mac は <kbd>⌘</kbd>+<kbd>Enter</kbd>）','確定して、同じ階層に次のカード（同じ反論先への2つ目の反論など）')}${K('<kbd>↑↓←→</kbd>','文中のカーソル移動（ふつうの文字入力と同じ）')}${K('<kbd>Shift</kbd>+<kbd>矢印</kbd>（反駁を書いているとき）','反駁先の論点を矢印の方向へ変える。↑↓ は一つ上／下の行（論点の流れ）の相手の最も新しい議論へ、←→ は同じ行の中で反論先／反論へ。書きかけで空の反駁は通り過ぎた時点で消え、書いた反駁は残る。行き先にこのスピーチの反駁がすでにあれば、それを書き直す')}${K('<kbd>Shift</kbd>+<kbd>↑↓</kbd>（論点・下位論点を書いているとき）','上下のカードの入力へ移る。いちばん下で <kbd>Shift</kbd>+<kbd>↓</kbd> を押すと、同じ階層に次のカードを追加')}${K('<kbd>Shift</kbd>+<kbd>Delete</kbd>','書いているカードをすぐに消す（下位・反論ごと。<kbd>Ctrl</kbd>+<kbd>Z</kbd> で戻せる。Mac は <kbd>Shift</kbd>+<kbd>fn</kbd>+<kbd>delete</kbd>）。<kbd>Delete</kbd> だけなら通常の文字削除')}${K('<kbd>Tab</kbd> / <kbd>Shift</kbd>+<kbd>Tab</kbd>','すぐ上のカードの下位へ／ひとつ上の階層へ')}</dl><p class="note">日本語の変換中のキーは、どれも確定や移動に使われません。</p></section>
  <section><h3>動く・見る</h3><div class="kcols"><dl class="keys">
    ${K('<kbd>Shift</kbd>+<kbd>↑↓</kbd>','同じ列の上下へ。いちばん下で <kbd>Shift</kbd>+<kbd>↓</kbd> を押すと新しいカードを追加（反駁なら、反駁先の一つ下の論点への反駁）')}${K('<kbd>Shift</kbd>+<kbd>→</kbd>','このカードへの反論へ（なければ右の列）')}${K('<kbd>Shift</kbd>+<kbd>←</kbd>','反論先へ（なければ左の列）')}${K('矢印のみ','移動だけ（追加はしない）')}${K('<kbd>Alt</kbd>+<kbd>↑↓</kbd>','カードを同じ階層で並べ替え')}${K('<kbd>Alt</kbd>+<kbd>←→</kbd>','カードを隣のスピーチ列へ移す')}
  </dl><dl class="keys">
    ${K('<kbd>[</kbd> <kbd>]</kbd> / <kbd>1</kbd>〜<kbd>9</kbd>','現在のスピーチを切替')}${K('<kbd>Space</kbd>','スピーチタイマー開始・停止')}${K('<kbd>D</kbd>','次の未反論カードへ')}${K('<kbd>F</kbd>','論点フォーカス（選んだ帯だけ強調）')}${K('<kbd>Ctrl</kbd>+<kbd>Z</kbd>','元に戻す（<kbd>Shift</kbd> 併用でやり直し）')}${K('<kbd>Esc</kbd>','選択・モードの解除')}${K('質疑','試合の順番とタイマーには入るが、ふだんはメモしない。その間は質問されている立論（否定側質疑なら肯定側立論、肯定側質疑なら否定側立論）に書き足せる。質疑そのものをメモしたい試合は「表示」または試合形式の「質疑のメモ」で「メモする」にする')}${K('<kbd>Ctrl</kbd>/<kbd>⌘</kbd>＋ホイール、ピンチ','フローの拡大・縮小（カーソルの位置を中心に。100%〜250%）。「−／＋」ボタンでも可')}${K('何もない所をドラッグ','フローを上下左右に動かす（中ボタンのドラッグはどこでも可）。ホイールで上下、<kbd>Shift</kbd>＋ホイールで左右')}
  </dl></div></section>
  <section><h3>番号と種類</h3><p style="margin:0">論点は「肯1」「否1」、下位は「肯1-2」、反論は「肯1·否a」（肯1への否定側の a 番目）と付きます。種類は 論点／下位／反論／再反論／延長（同じ側が後のスピーチで伸ばす）／質疑 を自動で判定します。<br>「未反論」は、そのカードより後の相手側スピーチ（質疑を除く）が始まっているのに、相手がまだ答えていないカードに付きます。下位論点のどれか、または親の論点に反論があれば答えたものとみなします。</p></section>`);
}

/* ================= 保存 ================= */
const LS='debate-flow.v1';
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({rounds:S.rounds,curId:S.curId,settings:S.settings}));}catch(e){}}
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LS)||'null');if(d&&Array.isArray(d.rounds)){S.rounds=d.rounds.map(normRound).filter(Boolean);d.rounds.forEach((x,i)=>{if(x&&x.sample&&S.rounds[i])S.rounds[i].sample=true;});S.curId=d.curId;if(d.settings)Object.assign(S.settings,d.settings);}}catch(e){}}
let localT=0;function saveLocalSoon(){clearTimeout(localT);localT=setTimeout(saveLocal,300);}
function touch(r){r.updatedAt=Date.now();r.touched=true;saveLocalSoon();scheduleCloud(r.id);}
let touchT=0;function touchSoon(){clearTimeout(touchT);touchT=setTimeout(()=>{const r=R();if(r)touch(r);},500);}
let setT=0;function saveSettings(){saveLocalSoon();clearTimeout(setT);setT=setTimeout(cloudSettings,1200);}

const store={db:null,uid:null,ok:false,tm:{},inflight:{},again:{},retried:{}};
function setSave(state,text){const s=$('#save');s.className=state;$('#saveTx').textContent=text;}
function userCol(){return store.db.collection('data/users/'+store.uid);}
function scheduleCloud(id){if(!store.ok)return;clearTimeout(store.tm[id]);store.tm[id]=setTimeout(()=>cloudWrite(id),1200);setSave('saving','保存待ち…');}
async function cloudWrite(id){
  if(!store.ok)return;
  if(store.inflight[id]){store.again[id]=true;return;}
  const r=S.rounds.find(x=>x.id===id);if(!r)return;
  if(r.sample&&!r.touched)return;
  store.inflight[id]=true;setSave('saving','保存中…');
  try{
    const body=Object.assign({},r);delete body.touched;
    await userCol().doc(id).set({kind:'round',updatedAt:r.updatedAt,title:String(r.title).slice(0,200),json:JSON.stringify(body)});
    store.retried[id]=false;setSave('cloud','保存済み');
  }catch(e){cloudErr(e,()=>cloudWrite(id),id);}
  finally{store.inflight[id]=false;if(store.again[id]){store.again[id]=false;cloudWrite(id);}}
}
async function cloudDelete(id){if(!store.ok)return;clearTimeout(store.tm[id]);try{await userCol().doc(id).delete();setSave('cloud','保存済み');}catch(e){cloudErr(e,()=>cloudDelete(id),'del'+id);}}
async function cloudSettings(){if(!store.ok)return;try{await userCol().doc('_settings').set({kind:'settings',json:JSON.stringify({settings:S.settings,curId:S.curId})});}catch(e){/* 表示設定は端末にも保存済み */}}
function cloudErr(e,retry,key){
  const c=e&&e.code;
  if(c==='unavailable'&&!store.retried[key]){store.retried[key]=true;setTimeout(retry,600+Math.random()*900);return;}
  if(c==='quota_exceeded'){setSave('err','保存容量の上限です。不要な試合を削除してください（この端末には保存中）');return;}
  if(c==='resource_exhausted'){setTimeout(retry,4000);return;}
  store.ok=false;
  if(c==='invalid_argument'){store.mode='limited';setSave('','このブラウザに保存');return;}
  setSave('err','アカウントに保存できません（このブラウザにだけ保存中）');
}
async function initCloud(){
  if(!(window.claude&&typeof window.claude.use==='function')){setSave('','この端末に保存');return;}
  setSave('saving','アカウントに接続中…');
  let user=null,db=null;
  try{[user,db]=await Promise.all([window.claude.use('user'),window.claude.use('db')]);}catch(e){}
  if(!db||!user){setSave('','この端末に保存');return;}
  let id=null;try{id=await user.id();}catch(e){}
  if(!id){setSave('','この端末に保存');return;}
  let canW=null;try{canW=await user.can('data.write');}catch(e){}
  if(canW===false){store.mode='limited';setSave('','このブラウザに保存');return;}
  store.db=db;store.uid=id;
  const to=setTimeout(()=>setSave('err','アカウントに接続できません（この端末に保存中）'),10000);
  let snap;
  try{snap=await userCol().get();}catch(e){clearTimeout(to);setSave('err','アカウントに接続できません（この端末に保存中）');return;}
  clearTimeout(to);
  store.ok=true;
  const cloud=new Map();let cset=null;
  for(const d of snap.docs){const v=d.data();if(!v)continue;
    if(v.kind==='round'){try{const r=normRound(JSON.parse(v.json));if(r)cloud.set(d.id,r);}catch(e){}}
    else if(v.kind==='settings'){try{cset=JSON.parse(v.json);}catch(e){}}}
  const local=S.rounds.filter(r=>!(r.sample&&!r.touched));
  const ids=new Set([...cloud.keys(),...local.map(r=>r.id)]);
  const merged=[];const upload=[];
  for(const rid of ids){const c=cloud.get(rid),l=local.find(x=>x.id===rid);
    if(c&&l){if(l.updatedAt>c.updatedAt){merged.push(l);upload.push(rid);}else merged.push(c);}
    else if(l){merged.push(l);upload.push(rid);}else merged.push(c);}
  if(merged.length){
    const keepEdit=ui.edit;
    S.rounds=merged;
    if(cset){if(cset.settings)Object.assign(S.settings,cset.settings);if(cset.curId&&merged.some(x=>x.id===cset.curId)&&!keepEdit)S.curId=cset.curId;}
    if(!S.rounds.some(x=>x.id===S.curId))S.curId=S.rounds.slice().sort((a,b)=>b.updatedAt-a.updatedAt)[0].id;
    if(!card(keepEdit)){ui.edit=null;}
    applySettings();timerReset();saveLocal();render();
  }
  for(const rid of upload)cloudWrite(rid);
  setSave('cloud','アカウントに保存');
}
function flush(){for(const id of Object.keys(store.tm)){clearTimeout(store.tm[id]);cloudWrite(id);}saveLocal();}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flush();});
window.addEventListener('pagehide',flush);

/* ================= 起動 ================= */
loadLocal();
if(!S.rounds.length){const s=sampleRound();S.rounds=[s];S.curId=s.id;}
applySettings();timerReset();render();
initCloud();
(async()=>{try{if(window.claude&&typeof window.claude.use==='function')dl=await window.claude.use('downloads');}catch(e){dl=null;}})();
</script>
